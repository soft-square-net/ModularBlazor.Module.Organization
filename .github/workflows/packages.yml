# Packs the module's NuGet packages and its bundle, in one version:
#   - soft.square.net.Organization.Contracts  (src/Organization.Contracts)
#   - soft.square.net.Organization.Client     (src/WebApi.Modules.Organization.Client, the typed API client)
#   - organization-<version>.zip              the bundle (scripts/Pack-Bundle.ps1: server, client parts, packages)
#
#   - push to main / pull request:  <VersionPrefix>-ci.<run>  packed and kept as workflow artifacts, not published
#   - tag v1.2.0-preview.1:          1.2.0-preview.1          the packages are published to GitHub Packages; the bundle
#                                                             is the "bundle" artifact (the admin installs it by hand)
#
# A tag must name the version in Directory.Build.props (v<VersionPrefix>-<VersionSuffix>), or the run fails before
# anything is published. Published to https://nuget.pkg.github.com/soft-square-net/index.json with the workflow's own
# token, only on a v* tag (the same pattern as the Platform repo's platform-packages.yml).
name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      # NuGet.Config reads the platform feed's token from here (the Client project builds with the Module SDK).
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $project = (dotnet msbuild src/WebApi.Modules.Organization.Web -nologo -getProperty:Version).Trim()
          $prefix = (dotnet msbuild src/WebApi.Modules.Organization.Web -nologo -getProperty:VersionPrefix).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -ne $project) { throw "Tag $env:GITHUB_REF_NAME does not match the version in Directory.Build.props ($project): tag v$project, or raise the version first." }
          } else {
            $version = "$prefix-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (projects: $project)"

      - name: Pack
        shell: pwsh
        run: |
          foreach ($project in 'src/Organization.Contracts', 'src/WebApi.Modules.Organization.Client') {
            dotnet pack $project -c Release -o artifacts/packages "-p:Version=${{ steps.version.outputs.version }}"
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $project" }
          }

      - name: Bundle
        shell: pwsh
        run: ./scripts/Pack-Bundle.ps1 -Version '${{ steps.version.outputs.version }}' -Output artifacts/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: artifacts/bundle/*.zip

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
